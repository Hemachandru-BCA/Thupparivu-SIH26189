name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment for this environment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Base path = the GitHub repository name (so the app lives at
      # https://<user>.github.io/<repo>/). Change this to your exact repo name.
      BASE_PATH: /Thupparivu-SIH26189
      # Production backend URL. Set this in GitHub repo Settings ->
      # Secrets and variables -> Actions -> Variables. Defaults to the Railway
      # backend when no repo variable is configured.
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://enthusiastic-creativity-production-27af.up.railway.app' }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://enthusiastic-creativity-production-27af.up.railway.app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Create 404.html for SPA routing
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
