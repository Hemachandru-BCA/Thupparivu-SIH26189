name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'  # every 14 minutes
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Warm up backend
        run: |
          curl -sf "${{ vars.VITE_API_URL }}/api/warmup" \
            --max-time 10 --retry 2 --retry-delay 5 || true

      - name: Log result
        run: echo "Backend warmup complete"