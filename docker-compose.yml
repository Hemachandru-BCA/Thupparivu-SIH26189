# SentinelGraph AI - local demo stack (and optional production services)
#
# Demo core (no credentials required):
#   docker compose up --build api ui
#
# Optional production adapters (disabled by default; profiles keep them out
# of the demo path):
#   docker compose --profile neo4j up -d
#   docker compose --profile postgres up -d
#   docker compose --profile kafka up -d
#
# The API reads pipeline artifacts from the ./data volume; run the pipeline
# locally (python run_demo.py) or POST /api/pipeline/run-all first.

services:
  api:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python -m spacy download en_core_web_sm -q &&
             uvicorn src.api.main:app --host 0.0.0.0 --port 8000"
    environment:
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      SENTINELGRAPH_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./data:/app/data

  ui:
    image: node:22-alpine
    working_dir: /app/frontend
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - ui_node_modules:/app/frontend/node_modules
    depends_on:
      - api

  # ------------------------- optional production adapters (profiles) ------ #
  neo4j:
    image: neo4j:5-community
    profiles: ["neo4j"]
    environment:
      NEO4J_AUTH: neo4j/sentinelgraph-demo
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: sentinelgraph
      POSTGRES_PASSWORD: sentinelgraph-demo
      POSTGRES_DB: sentinelgraph
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  kafka:
    image: bitnami/kafka:3.7
    profiles: ["kafka"]
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka

volumes:
  ui_node_modules:
  neo4j_data:
  pg_data:
  kafka_data:
