# Cloudflare Pages configuration
# Vite builds to ./dist, which is set as the site bucket
site = { bucket = "./dist" }

# Build configuration
[build]
command = "pnpm build"

# Environment variables for production builds
[build.environment]
NODE_VERSION = "20"

# Cloudflare Pages environment variables
# Set these in Cloudflare dashboard or .env.production
[dev]
port = 5173
