[phases.setup]
nixPkgs = ['python-3.11', 'pip']

[phases.install]
commands = [
  'pip install --no-cache-dir -r requirements.txt'
]

[phases.build]
commands = ['echo Build complete']

[phases.start]
commands = [
  'uvicorn src.api.main:app --host 0.0.0.0 --port $PORT'
]

[variables]
PYTHON_VERSION = '3.11'
